<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hammad & Aiman - Wedding Invitation</title>
    
    <!-- Meta Tags for Open Graph -->
    <meta property="og:title" content="Hammad & Aiman - Wedding Invitation">
    <meta property="og:description" content="Two Souls, One Path. We invite you to share our joy.">
    <meta property="og:image" content="../assets/images/og-image.jpg">
    <meta property="og:type" content="website">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/fonts/fonts.css">
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
</head>
<body>
    <!-- Gatefold Intro: two doors swing open on their outer edges, like a cabinet opening -->
    <div id="envelope-screen" class="gatefold-screen" role="button" tabindex="0" aria-label="Open Invitation">
        <div class="gate gate-left">
            <div class="gate-seal"></div>
        </div>
        <div class="gate gate-right"></div>
        <p class="tap-to-open">Tap or scroll to open</p>
    </div>

    <button id="music-toggle" class="music-toggle" aria-label="Toggle Music">
        <svg id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </button>

    <!-- Main Content -->
    <main id="main-content">
        
        <!-- Hero Section -->
        <section class="hero section-animate">
            <div class="section-scroll">
                <div class="hero-content">
                    <p class="wedding-day-text" id="hero-label">Wedding Day</p>
                    <p class="wedding-date" id="hero-date"></p>
                    <h1 class="couple-names" id="hero-names"></h1>

                    <p class="generic-message" id="generic-message" hidden>Thank you for visiting.<br>Please use the personal invitation link shared with you to view your event details.</p>

                    <div class="scroll-indicator">
                        <p>Scroll down</p>
                        <div class="chevron"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Blessing Section (removed by JS on editions that don't include it) -->
        <section class="blessing section-animate" id="blessing-section">
            <div class="section-scroll">
                <!-- Bismillah SVG or Text -->
                <div class="bismillah">
                    بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم
                </div>
                <div class="blessing-text" id="blessing-text">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <!-- Countdown Section -->
        <section class="countdown section-animate" id="countdown-section">
            <div class="section-scroll">
                <h2 class="section-title">The Celebration Begins In</h2>
                <div class="countdown-timer" id="countdown-timer">
                    <div class="time-block"><span id="cd-days">00</span><label>Days</label></div>
                    <div class="time-separator">:</div>
                    <div class="time-block"><span id="cd-hours">00</span><label>Hours</label></div>
                    <div class="time-separator">:</div>
                    <div class="time-block"><span id="cd-mins">00</span><label>Minutes</label></div>
                    <div class="time-separator">:</div>
                    <div class="time-block"><span id="cd-secs">00</span><label>Seconds</label></div>
                </div>
            </div>
        </section>

        <!-- Invitation/Programme cards for each included event are injected here by JS, one per card in config.events[x].cards -->

        <!-- Schedule Section (removed by JS on single-event editions) -->
        <section class="schedule section-animate" id="schedule-section">
            <div class="section-scroll">
                <h2 class="section-title">Schedule of Events</h2>
                <div class="timeline" id="timeline">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <!-- Location Section -->
        <section class="location section-animate">
            <div class="section-scroll">
                <div id="venues-container">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <!-- Closing Section (removed by JS on the Ijtema-only edition) -->
        <section class="closing section-animate" id="closing-section">
            <div class="section-scroll">
                <div class="closing-content" id="closing-content">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="../assets/music/bgm.mp3" type="audio/mpeg">
    </audio>

    <script>window.__inviteOverride = "full";</script>
    <script src="../js/config.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
